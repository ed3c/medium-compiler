<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img"><title>One causal map</title><desc>Trace the definition, representation, runtime and proof separately.</desc><rect width="1500" height="900" fill="#FAF9F5"/><text x="75" y="83" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="750" fill="#69766E">ALG FOUR  /  ZERO-CONTEXT ENGINEERING</text><path d="M75 120H1425" stroke="#CDD6CE" stroke-width="2"/><text x="75" y="184" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="800" fill="#233029">One causal map</text><text x="75" y="236" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="450" fill="#536159">Trace the definition, representation, runtime and proof separately.</text><rect x="72" y="326" rx="23" width="412" height="210" fill="#E3EDE8" stroke="#CDD6CE" stroke-width="2"/><text x="97" y="384" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#28322D">Input contract</text><text x="97" y="434" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="450" fill="#536159">lowercase a-z</text><path d="M486 427 H542" stroke="#6C8073" stroke-width="4"/><rect x="552" y="326" rx="23" width="412" height="210" fill="#F5D858" stroke="#CDD6CE" stroke-width="2"/><text x="577" y="384" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#28322D">Equivalence</text><text x="577" y="434" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="450" fill="#536159">same letter frequencies</text><path d="M966 427 H1022" stroke="#6C8073" stroke-width="4"/><rect x="1032" y="326" rx="23" width="412" height="210" fill="#FFFFFF" stroke="#CDD6CE" stroke-width="2"/><text x="1057" y="384" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#28322D">Canonical key</text><text x="1057" y="434" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="450" fill="#536159">26-integer tuple</text><rect x="72" y="615" rx="23" width="635" height="144" fill="#E3EDE8" stroke="#CDD6CE" stroke-width="2"/><text x="97" y="673" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#28322D">Loop invariant</text><text x="97" y="723" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="450" fill="#536159">processed prefix is grouped</text><rect x="796" y="615" rx="23" width="635" height="144" fill="#FFFFFF" stroke="#CDD6CE" stroke-width="2"/><text x="821" y="673" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#28322D">Final output</text><text x="821" y="723" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="450" fill="#536159">hash-map group values</text><text x="80" y="821" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#4D6055">Expected counting time: O(N + M) with fixed alphabet.</text><path d="M75 844 H1425" stroke="#CDD6CE"/><text x="76" y="877" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="550" fill="#69766E">Group Anagrams · independent Figure</text></svg>