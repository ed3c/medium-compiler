t x="72" y="615" rx="23" width="635" height="144" fill="#E3EDE8" stroke="#CDD6CE" stroke-width="2"/><text x="97" y="673" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#28322D">Frequency tuple</text><text x="97" y="723" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="450" fill="#536159">eat : a=1, e=1, t=1</text><rect x="796" y="615" rx="23" width="635" height="144" fill="#FFFFFF" stroke="#CDD6CE" stroke-width="2"/><text x="821" y="673" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#28322D">Sorted string</text><text x="821" y="723" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="450" fill="#536159">eat -&gt; aet</text><text x="80" y="821" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#4D6055">Balanced merge levels explain complexity, not exact Timsort execution.</text><path d="M75 844 H1425" stroke="#CDD6CE"/><text x="76" y="877" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="550" fill="#69766E">Group Anagrams · independent Figure</text></svg>