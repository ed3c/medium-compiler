c">same identity</text><rect x="1000" y="280" width="162" height="118" rx="16" fill="#eef5f1" stroke="#4a8b81" stroke-width="2"/><text x="1017" y="317" font-family="Arial,sans-serif" font-size="22" fill="#17202a" font-weight="700">HASH MAP</text><text x="1017" y="350" font-family="Arial,sans-serif" font-size="18" fill="#54616c">group</text><path d="M 260 336 H 298 V 254 H 354" fill="none" stroke="#357f7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 298 336 V 446 H 354" fill="none" stroke="#357f7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 634 254 H 682 V 336 H 734" fill="none" stroke="#357f7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 634 446 H 682 V 336" fill="none" stroke="#357f7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 949 338 H 1000" fill="none" stroke="#357f7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="376" y="185" font-family="Arial,sans-serif" font-size="18" fill="#315d52">PRIMARY: fixed alphabet</text><text x="48" y="598" font-size="17" fill="#54616c" font-family="Arial,sans-serif">Counting and sorting are competing canonicalizations, not sequential stages</text></svg>
