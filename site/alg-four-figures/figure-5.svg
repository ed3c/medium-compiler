<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="05 · COST IS A MEASUREMENT: One execution has time, memory and output properties in parallel"><title>05 · COST IS A MEASUREMENT</title><desc>One execution has time, memory and output properties in parallel</desc><rect width="1200" height="630" fill="#fcfcf9"/><text x="48" y="80" font-size="40" font-weight="700" fill="#17202a" font-family="Arial,sans-serif">05 · COST IS A MEASUREMENT</text><text x="48" y="128" font-size="22" fill="#54616c" font-family="Arial,sans-serif">One execution has time, memory and output properties in parallel</text><line x1="48" x2="1152" y1="155" y2="155" stroke="#3b7a77" stroke-width="2"/><rect x="48" y="290" width="320" height="120" rx="16" fill="#eef5f1" stroke="#4a8b81" stroke-width="2"/><text x="65" y="327" font-family="Arial,sans-serif" font-size="22" fill="#17202a" font-weight="700">ALGORITHM</text><text x="65" y="360" font-family="Arial,sans-serif" font-size="18" fill="#54616c">N words · M characters</text><rect x="515" y="185" width="620" height="105" rx="16" fill="#eef5f1" stroke="#4a8b81" stroke-width="2"/><text x="532" y="222" font-family="Arial,sans-serif" font-size="22" fill="#17202a" font-weight="700">EXPECTED TIME</text><text x="532" y="255" font-family="Arial,sans-serif" font-size="18" fill="#54616c">O(M + 26N) · operations executed</text><rect x="515" y="325" width="620" height="105" rx="16" fill="#eef5f1" stroke="#4a8b81" stroke-width="2"/><text x="532" y="362" font-family="Arial,sans-serif" font-size="22" fill="#17202a" font-weight="700">EXTRA SPACE</text><text x="532" y="395" font-family="Arial,sans-serif" font-size="18" fill="#54616c">O(26N + N) · keys and references</text><rect x="515" y="465" width="620" height="100" rx="16" fill="#eef5f1" stroke="#4a8b81" stroke-width="2"/><text x="532" y="502" font-family="Arial,sans-serif" font-size="22" fill="#17202a" font-weight="700">RETURNED VALUE</text><text x="532" y="535" font-family="Arial,sans-serif" font-size="18" fill="#54616c">original strings grouped by canonical key</text><path d="M 368 350 H 450 V 234 H 515" fill="none" stroke="#357f7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 450 350 H 515" fill="none" stroke="#357f7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 450 350 V 514 H 515" fill="none" stroke="#357f7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="256" font-size="19" font-family="Arial,sans-serif" fill="#a25d18">No Time → Space → Output pipeline</text><text x="48" y="598" font-size="17" fill="#54616c" font-family="Arial,sans-serif">Output is a result; Time and Space measure how the result was produced</text></svg>
