name: Writing verification
on:
  push:
    branches: [agent/issue-8-lossless-skills]
  pull_request:
permissions:
  contents: read
jobs:
  mechanical-writing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tests and real article drives
        shell: bash
        run: |
          mkdir -p /tmp/writing-evidence
          git rev-parse HEAD > /tmp/writing-evidence/checkout.txt
          python3 -m unittest discover -s tests -v > /tmp/writing-evidence/tests.txt 2>&1
          node --experimental-sqlite --test tests/reliability_logic.test.mjs tests/cloudflare_interface.test.mjs > /tmp/writing-evidence/browser-cloudflare-contracts.txt 2>&1
          node --check examples/cloudflare-checkout-sandbox/src/index.mjs
          node --check site/reliability/browser-worker.mjs
          node --check site/more-route/more-route.js
          npm ci --ignore-scripts
          node --test tests/scoped_readback_runtime.test.mjs tests/outbox_runtime.test.mjs > /tmp/writing-evidence/scoped-readback-runtime.txt 2>&1
          npm run build > /tmp/writing-evidence/cloudflare-site-build.txt
          npm run build:cloudflare > /tmp/writing-evidence/cloudflare-lab-build.txt
          npm run test:site > /tmp/writing-evidence/cloudflare-site-runtime.txt 2>&1
          python3 .agents/skills/verify-medium/scripts/verify.py --feature mechanical --out /tmp/writing-evidence/mechanical
          set +e
          python3 .agents/skills/verify-medium/scripts/verify.py --feature behavior-evals --out /tmp/writing-evidence/behavior
          status=$?
          set -e
          test "$status" = 3
          printf 'BLOCKED: no fresh writer/reader experiment performed by this job\n' > /tmp/writing-evidence/behavior-status.txt
          git archive HEAD > /tmp/writing-evidence/checkout.tar
      - name: Run pinned sloptrim detector on English More Route draft
        shell: bash
        run: |
          mkdir -p /tmp/writing-evidence
          python3 .agents/skills/sloptrim/scripts/detect.py articles/agent-handbook-zero-context.en.md > /tmp/writing-evidence/more-route-sloptrim.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/writing-evidence/more-route-sloptrim.json').read_text())
          if not isinstance(result,dict) or not result:
              raise SystemExit('Missing sloptrim diagnostic report')
          print('SLoptrim detector executed on the English More Route draft. Semantic fidelity still needs independent author/reader review.')
          print('Diagnostic report keys:', ', '.join(sorted(result.keys())))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanical-writing-evidence
          path: /tmp/writing-evidence/
          retention-days: 7
