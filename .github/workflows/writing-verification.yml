name: Materialize reviewed article increments
on:
  push:
    branches: [agent/issue-8-lossless-skills]
permissions:
  contents: write
jobs:
  install-reviewed-article:
    if: github.ref == 'refs/heads/agent/issue-8-lossless-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Replay reviewed increments and test before committing
        shell: bash
        run: |
          mkdir -p /tmp/writing-evidence
          git rev-parse HEAD > /tmp/writing-evidence/input-checkout.txt
          python3 evidence/issue-8/replay.py --out /tmp/writing-evidence/article-replay --update-article
          python3 -m unittest discover -s tests -v > /tmp/writing-evidence/tests.txt 2>&1
          python3 .agents/skills/verify-medium/scripts/verify.py --feature mechanical --out /tmp/writing-evidence/mechanical
          set +e
          python3 .agents/skills/verify-medium/scripts/verify.py --feature behavior-evals --out /tmp/writing-evidence/behavior
          status=$?
          set -e
          test "$status" = 3
          cp /tmp/writing-evidence/tests.txt evidence/issue-8/tests.txt
          cp /tmp/writing-evidence/mechanical/feature-results.json evidence/issue-8/mechanical-results.json
          cp /tmp/writing-evidence/behavior/feature-results.json evidence/issue-8/behavior-readiness.json
          cp .github/writing-verification-readonly.yml .github/workflows/writing-verification.yml
          rm .github/writing-verification-readonly.yml
          git add -- articles/ai-engineer-learning-path.md articles/ai-engineer-learning-path.context.json articles/ai-engineer-learning-path.parts evidence/issue-8
          git add -A -- .github/workflows/writing-verification.yml .github/writing-verification-readonly.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: retain verified two-patch article and read-only verification workflow'
          git push origin HEAD:refs/heads/agent/issue-8-lossless-skills
          git rev-parse HEAD > /tmp/writing-evidence/checkout.txt
          git archive HEAD > /tmp/writing-evidence/checkout.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanical-writing-evidence
          path: /tmp/writing-evidence/
          retention-days: 7
