name: Cloud writer qualification (no model calls)
on:
  push:
    branches: [agent/issue-8-lossless-skills]
    paths:
      - .github/workflows/cloud-writer-doctor.yml
      - scripts/cloud_writer_doctor.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-doctor:
    if: github.repository == 'ed3c/medium-compiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Codex in runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-cloud" "$RUNNER_TEMP/codex-download"
          url='https://github.com/openai/codex/releases/download/rust-v0.157.1/codex-package-x86_64-unknown-linux-musl.tar.gz'
          curl --fail --location --max-time 180 "$url" -o "$RUNNER_TEMP/codex-download/codex.tar.gz"
          echo '0e211868c9fd73cb49ad35ac675b5eafdf6b9f453df8a493df980c59a590fe5f  '"$RUNNER_TEMP/codex-download/codex.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/codex-download/codex.tar.gz" -C "$RUNNER_TEMP/codex-cloud"
          mapfile -t binaries < <(find "$RUNNER_TEMP/codex-cloud" -type f \( -name codex -o -name codex-x86_64-unknown-linux-musl \))
          test "${#binaries[@]}" = 1
          chmod u+x "${binaries[0]}"
          echo "CODEX_PROBE_BINARY=${binaries[0]}" >> "$GITHUB_ENV"
      - name: Probe CLI and bounded sandbox canaries without authenticating
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          MODEL_AUTH_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          set +e
          python3 scripts/cloud_writer_doctor.py \
            --codex "$CODEX_PROBE_BINARY" \
            --out "$RUNNER_TEMP/writer-cloud-evidence" \
            --credential-configured "$MODEL_AUTH_CONFIGURED"
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/cloud-doctor-exit.txt"
          test "$code" = 3
          test -f "$RUNNER_TEMP/writer-cloud-evidence/report.json"
          echo 'Probe completed; BLOCKED is not behavioral PASS.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-cloud-qualification
          path: |
            ${{ runner.temp }}/writer-cloud-evidence/
            ${{ runner.temp }}/cloud-doctor-exit.txt
          retention-days: 7
